[text]
menu_new_game="Novo jogo"
menu_continue="Aperte ESPAÇO para iniciar"
story_continue="Aperte ESPACO para continuar"
opening_paragraph_1="Quando nosso velho [i]soba[/i] partiu para junto dos antepassados, um novo líder foi escolhido entre os Kanbundos, povo de caçadores e guerreiros das grandes savanas da África Centro-Ocidental. Mas a vontade dos vivos não bastava. Era preciso ouvir aqueles que vieram antes de nós."
opening_paragraph_2="O novo [i]soba[/i] procurou então os anciãos. Consultamos os espíritos dos antepassados, e eles nos revelaram sua vontade. Para conquistar sua aprovação, o novo governante deveria provar sua coragem, sua sabedoria e a lealdade de seu povo."
opening_paragraph_3="Os antepassados exigiram a construção de um monumento em sua homenagem. Três materiais sagrados deveriam ser reunidos: a madeira das florestas do noroeste, o couro dos rebanhos do sul e o mais precioso de todos, o marfim dos grandes elefantes que habitavam o interior do continente"
intro_story="O marfim não seria obtido facilmente. Sua caça exigiria mais do que força. Seriam necessárias astúcia, coragem e a proteção dos espíritos. Assim, o novo [i]soba[/i] reuniu seus melhores guerreiros, caçadores e feiticeiros. Nós os vimos partir em busca do marfim sagrado em uma manhã calma. O que os aguardava nas terras do leste, nem mesmo os antepassados poderiam prever."
intro_continue="Pressione espaço para continuar"
restart_hint="Pressione R para reiniciar"
result_continue="Pressione espaço para continuar ou R para reiniciar"
victory="VITÓRIA!"
defeat="DERROTA"
victory_paragraph_1="Os grandes elefantes tombaram diante da coragem e da astúcia dos Kambundos. A provação havia terminado. O marfim sagrado, tão precioso aos olhos dos antepassados, finalmente estava em nossas mãos."
victory_paragraph_2="Com o retorno dos caçadores, o monumento pôde enfim ser concluído. Madeira, couro e marfim foram reunidos em homenagem àqueles que vieram antes de nós. Os antepassados haviam recebido nossa oferenda."
victory_paragraph_3="Nosso novo [i]soba[/i] conquistara a aprovação dos espíritos e o respeito de seu povo. Sob a bênção dos antepassados, sua autoridade estava consolidada. Os Kanbundos poderiam agora seguir unidos sob sua liderança."
defeat_paragraph_1="Os grandes elefantes avançaram sobre nossos guerreiros com uma força que nenhum homem pôde resistir. Lanças se partiram, machados caíram e nossos melhores guerreiros e caçadores foram esmagados. A savana tornou-se o túmulo de muitos Kanbundos."
defeat_paragraph_2="Sem o marfim sagrado, o monumento permaneceu inacabado. A provação havia fracassado, e os antepassados negaram sua bênção ao novo [i]soba[/i]. Sua autoridade, ainda tão recente, começou a desmoronar."
defeat_paragraph_3="Sem a proteção dos espíritos e sem confiança em seu governante, os Kanbundos se dividiram. Famílias abandonaram suas terras, antigos aliados se tornaram inimigos e a comunidade se desfez. Assim terminou o governo daquele que não conseguiu conquistar a aprovação dos antepassados."
